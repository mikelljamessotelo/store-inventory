<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>POS Calculator</title>

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
/* ===== GLOBAL ===== */
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:#000;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  touch-action:manipulation;
  user-select:none;
}
*,input,button,textarea{
  box-sizing:border-box;
  font-size:16px!important;
}
input,textarea{user-select:text}

/* ===== LAYOUT ===== */
:root{--keypad:260px}
.page{min-height:100vh;padding-bottom:var(--keypad)}
.app{max-width:480px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}

/* ===== TOTALS ===== */
.totals{
  display:flex;
  justify-content:space-between;
  background:#111;
  padding:16px;
  border-radius:12px;
}
.label{color:#aaa}

/* ===== TABLE ===== */
.table{
  background:#111;
  border-radius:10px;
  padding:8px;
}
.header,.row{
  display:grid;
  grid-template-columns:1.4fr 1.6fr 1fr;
  gap:6px;
  align-items:center;
}
.header{color:#aaa;border-bottom:1px solid #333;padding-bottom:4px}
.row.active{outline:2px solid #0a84ff;border-radius:6px}

/* ===== INPUTS ===== */
.amount{
  width:100%;
  padding:10px;
  background:#151515;
  border:1px solid #333;
  border-radius:8px;
  text-align:right;
  color:#fff;
}
.subtotal{text-align:right;font-weight:700}

/* ===== QTY ===== */
.qty{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  visibility:hidden;
}
.row.active .qty{visibility:visible}
.qty button{
  width:56px;height:56px;
  font-size:32px!important;
  border-radius:10px;
  background:#2c2c2e;
  color:#fff;
}
.qty span{min-width:32px;text-align:center;font-weight:800}

/* ===== BUTTONS ===== */
button{
  font-size:32px!important;
  font-weight:800;
  padding:14px;
  border:none;
  border-radius:12px;
}
.btn-main{background:#0a84ff;color:#fff}
.btn-danger{background:#b00020;color:#fff}

/* ===== KEYPAD ===== */
.keypad{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:var(--keypad);
  background:#050505;
  padding:12px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

/* ===== MODAL ===== */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal{
  background:#111;
  padding:16px;
  border-radius:16px;
  width:92%;
  max-width:420px;
}
.modal textarea{
  width:100%;
  min-height:220px;
  background:#000;
  color:#fff;
  border:1px solid #333;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="page">
<div class="app">

<h2 style="text-align:center">POS Calculator</h2>

<div class="totals">
  <div><div class="label">TOTAL</div><div id="total">0.00</div></div>
  <div><div class="label">QTY</div><div id="totalQty">0</div></div>
</div>

<button class="btn-main" onclick="openPayment()">DONE</button>

<div class="table">
  <div class="header">
    <div>Amount</div>
    <div style="text-align:center">QTY</div>
    <div style="text-align:right">Total</div>
  </div>
  <div id="rows"></div>
</div>

</div>
</div>

<!-- KEYPAD -->
<div class="keypad">
<button onclick="k('7')">7</button>
<button onclick="k('8')">8</button>
<button onclick="k('9')">9</button>
<button class="btn-danger" onclick="bk()">⌫</button>

<button onclick="k('4')">4</button>
<button onclick="k('5')">5</button>
<button onclick="k('6')">6</button>
<button class="btn-danger" onclick="reset()">AC</button>

<button onclick="k('1')">1</button>
<button onclick="k('2')">2</button>
<button onclick="k('3')">3</button>
<button class="btn-main" onclick="next()">↓</button>

<button onclick="k('0')">0</button>
<button onclick="k('00')">00</button>
<button onclick="k('.')">.</button>
</div>

<!-- PAYMENT -->
<div class="modal-bg" id="payBg">
<div class="modal">
<h3>Payment</h3>
<p>Total: ₱<span id="payTotal"></span></p>
<input id="cash" placeholder="Cash" readonly>
<p>Change: ₱<span id="change">0.00</span></p>
<button onclick="finish()">Finish</button>
</div>
</div>

<!-- RECEIPT -->
<div class="modal-bg" id="recBg">
<div class="modal">
<h3>Receipt</h3>
<textarea id="receipt" readonly></textarea>
<button onclick="copy()">Copy</button>
<button onclick="printR()">Print</button>
<button onclick="closeR()">Close</button>
</div>
</div>

<script>
let rows=document.getElementById('rows');
let active=0;

/* ROW */
function addRow(){
  const i=rows.children.length;
  const r=document.createElement('div');
  r.className='row';
  r.dataset.i=i;
  r.innerHTML=`
    <input class="amount" readonly>
    <div class="qty">
      <button onclick="q(${i},-1)">−</button>
      <span id="q${i}">1</span>
      <button onclick="q(${i},1)">+</button>
    </div>
    <div class="subtotal" id="s${i}">0.00</div>
  `;
  r.onclick=()=>select(i);
  rows.appendChild(r);
}
function select(i){
  active=i;
  [...rows.children].forEach(r=>r.classList.remove('active'));
  rows.children[i].classList.add('active');
}
function q(i,d){
  let e=document.getElementById('q'+i);
  e.textContent=Math.max(0,(+e.textContent)+d);
  calc();
}

/* KEYPAD */
function k(v){
  let a=rows.children[active].querySelector('.amount');
  a.value+=v;
  calc();
}
function bk(){
  let a=rows.children[active].querySelector('.amount');
  a.value=a.value.slice(0,-1);
  calc();
}
function next(){
  if(active===rows.children.length-1) addRow();
  select(active+1);
}

/* TOTALS */
function calc(){
  let t=0,q=0;
  [...rows.children].forEach((r,i)=>{
    let a=parseFloat(r.querySelector('.amount').value)||0;
    let qq=+document.getElementById('q'+i).textContent;
    document.getElementById('s'+i).textContent=(a*qq).toFixed(2);
    t+=a*qq;q+=qq;
  });
  total.textContent=t.toFixed(2);
  totalQty.textContent=q;
}

/* PAYMENT */
function openPayment(){
  payTotal.textContent=total.textContent;
  payBg.style.display='flex';
}
cash.oninput=()=>change.textContent=(cash.value-total.textContent).toFixed(2);

function finish(){
  receipt.value=`TOTAL: ₱${total.textContent}\nQTY: ${totalQty.textContent}\nDATE: ${new Date().toLocaleString()}`;
  payBg.style.display='none';
  recBg.style.display='flex';
}

/* RECEIPT */
function copy(){navigator.clipboard.writeText(receipt.value)}
function printR(){
  let w=window.open('');
  w.document.write('<pre>'+receipt.value+'</pre>');
  w.print();
}
function closeR(){recBg.style.display='none';reset()}

/* RESET */
function reset(){
  rows.innerHTML='';
  addRow();
  select(0);
  calc();
}

addRow();select(0);
</script>
</body>
</html>
