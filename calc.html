<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Amount × QTY Calculator — Receipt Header/Footer Control</title>

<!-- NO DOUBLE-TAP ZOOM -->
<meta name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

<style>
/* ================= GLOBAL SAFETY ================= */
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  margin:0;
  padding:0;
  background:#000;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  height:100%;
  touch-action:manipulation;
  user-select:none;
}
*,*::before,*::after,
input,button,textarea,select{
  box-sizing:border-box;
  font-size:16px !important;
  touch-action:manipulation;
}
input,textarea{user-select:text}
button{cursor:pointer;font-family:inherit}

/* ================= LAYOUT ================= */
:root{
  --keypad-height:260px;
  --max-width:480px;
}
.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding-bottom:var(--keypad-height);
}
.app{
  width:100%;
  max-width:var(--max-width);
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:12px;
  height:calc(100vh - var(--keypad-height));
}
h1{text-align:center;margin:8px 0}

/* ================= TOTALS ================= */
.totals{
  display:flex;
  justify-content:space-between;
  background:#111;
  padding:18px 16px;
  border-radius:12px;
  border:1px solid #2a2a2a;
  font-weight:700;
}
.label{
  display:block;
  color:#a0a0a0;
  font-weight:600;
  margin-bottom:4px;
}

/* ================= BUTTONS (2× BIGGER) ================= */
button,
.num-key,
.cash-buttons button,
.modal-buttons button,
.receipt-actions button{
  font-size:32px !important;
  font-weight:800;
}

/* ================= TABLE ================= */
.table{
  background:#111;
  border-radius:10px;
  padding:8px;
  border:1px solid #2a2a2a;
  overflow-y:auto;
}
.table-header,.item-row{
  display:grid;
  grid-template-columns:1.3fr 1.7fr 1fr;
  gap:6px;
  align-items:center;
}
.table-header{
  font-weight:600;
  color:#b0b0b0;
  border-bottom:1px solid #2a2a2a;
  padding-bottom:4px;
  position:sticky;
  top:0;
  background:#111;
  z-index:1;
}

/* ================= INPUTS ================= */
.amount-input{
  width:100%;
  padding:10px;
  background:#151515;
  border-radius:8px;
  border:1px solid #333;
  text-align:right;
  color:#fff;
}
.row-total{text-align:right;font-weight:600}

/* ================= PATCH: INLINE QTY ================= */
.qty-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  visibility:hidden;
}
.item-row.active .qty-wrap{visibility:visible}

.qty-btn{
  min-width:56px;
  min-height:56px;
  background:#2c2c2e;
  color:#fff;
  border-radius:10px;
  border:1px solid #333;
}
.qty-display{
  min-width:48px;
  text-align:center;
  font-weight:800;
}

/* ================= KEYPAD ================= */
.keypad-fixed{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:var(--max-width);
  height:var(--keypad-height);
  background:#050505;
  padding:12px;
  border-top:1px solid #181818;
  z-index:9999;
}
.pad-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.num-key{
  padding:14px 0;
  background:#1c1c1e;
  color:#fff;
  border-radius:10px;
  border:1px solid #2a2a2a;
}
.key-secondary{background:#2c2c2e}
.key-danger{background:#b00020}
.key-main{background:#0a84ff}

/* ================= MODALS & RECEIPT ================= */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99999;
}
.modal{
  background:#111;
  padding:16px;
  border-radius:16px;
  width:92%;
  max-width:420px;
  border:1px solid #2a2a2a;
  color:#fff;
}
textarea#receiptText{
  width:100%;
  min-height:220px;
  margin-top:10px;
  padding:8px;
  border-radius:8px;
  border:1px solid #333;
  background:#000;
  color:#fff;
  font-family:"Courier New",monospace;
  white-space:pre;
}
.receipt-actions{display:flex;gap:10px;margin-top:12px}
.receipt-actions button{flex:1}
</style>
</head>

<body>

<!-- ================= APP ================= -->
<div class="page">
<div class="app">

<h1>Amount × QTY Calculator</h1>

<div class="totals">
  <div>
    <span class="label">Total Amount</span>
    <span id="totalAmount">0.00</span>
  </div>
  <div style="text-align:right">
    <span class="label">Total QTY</span>
    <span id="totalQty">0</span>
  </div>
</div>

<div style="display:flex;gap:8px">
  <button class="btn-main" id="openSummaryBtn">DONE</button>
  <button class="btn-reset" id="resetBtn">↻</button>
</div>

<div class="table" id="rowsContainerWrap">
  <div class="table-header">
    <div>Amount</div>
    <div style="text-align:center">QTY</div>
    <div style="text-align:right">Total</div>
  </div>
  <div id="rowsContainer"></div>
</div>

</div>
</div>

<!-- ================= KEYPAD ================= -->
<div class="keypad-fixed" id="keypad">
  <div class="pad-grid" id="padAmount">
    <button class="num-key" data-key="7">7</button>
    <button class="num-key" data-key="8">8</button>
    <button class="num-key" data-key="9">9</button>
    <button class="num-key key-secondary" data-key="back">⌫</button>

    <button class="num-key" data-key="4">4</button>
    <button class="num-key" data-key="5">5</button>
    <button class="num-key" data-key="6">6</button>
    <button class="num-key key-danger" data-key="allclear">AC</button>

    <button class="num-key" data-key="1">1</button>
    <button class="num-key" data-key="2">2</button>
    <button class="num-key" data-key="3">3</button>
    <button class="num-key key-main" data-key="down" style="grid-row:span 2">↓</button>

    <button class="num-key" data-key="0">0</button>
    <button class="num-key" data-key="00">00</button>
    <button class="num-key" data-key=".">.</button>
  </div>
</div>

<!-- ================= PAYMENT MODAL ================= -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 style="text-align:center">Payment Summary</h2>

    <div class="modal-row">
      <div>Total:</div>
      <div id="modalTotalAmount">0.00</div>
    </div>

    <div class="modal-row">
      <div>Cash:</div>
      <input id="cashInput" type="number" readonly />
    </div>

    <div class="modal-row">
      <div>Change:</div>
      <div id="changeAmount">0.00</div>
    </div>

    <div class="cash-buttons">
      <button data-cash="50">50</button>
      <button data-cash="100">100</button>
      <button data-cash="500">500</button>
      <button data-action="clear">Clear</button>
    </div>

    <div class="modal-buttons">
      <button id="modalDoneBtn">Done</button>
      <button id="modalCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<!-- ================= RECEIPT MODAL ================= -->
<div class="modal-backdrop" id="receiptBackdrop">
  <div class="modal">
    <h2 style="text-align:center">Receipt</h2>
    <textarea id="receiptText" readonly></textarea>
    <div class="receipt-actions">
      <button id="copyReceiptBtn">Copy</button>
      <button id="printReceiptBtn">Print</button>
      <button id="receiptCloseBtn">Close</button>
    </div>
  </div>
</div>

<!-- ================= SCRIPT ================= -->
<script>
/* ===== CORE STATE ===== */
let activeRowIndex=0;
let lastReceiptText='';
const rowsContainer=document.getElementById('rowsContainer');
const totalAmountEl=document.getElementById('totalAmount');
const totalQtyEl=document.getElementById('totalQty');

/* ===== ROWS ===== */
function createRow(index){
  const row=document.createElement('div');
  row.className='item-row';
  row.dataset.index=index;
  row.innerHTML=`
    <div><input class="amount-input" readonly></div>
    <div class="qty-wrap">
      <button class="qty-btn">−</button>
      <div class="qty-display">1</div>
      <button class="qty-btn">+</button>
    </div>
    <div class="row-total">0.00</div>
  `;

  const amount=row.querySelector('.amount-input');
  amount.onclick=()=>setActiveRow(index);

  const minus=row.querySelectorAll('.qty-btn')[0];
  const plus=row.querySelectorAll('.qty-btn')[1];

  minus.onclick=e=>{
    e.stopPropagation();
    setQty(row,Math.max(0,getQty(row)-1));
  };
  plus.onclick=e=>{
    e.stopPropagation();
    setQty(row,getQty(row)+1);
  };

  return row;
}
function addRow(){rowsContainer.appendChild(createRow(rowsContainer.children.length));}

function setActiveRow(i){
  activeRowIndex=i;
  document.querySelectorAll('.item-row').forEach(r=>r.classList.remove('active'));
  document.querySelector(`[data-index="${i}"]`).classList.add('active');
}

function getQty(row){return parseInt(row.querySelector('.qty-display').textContent)||0}
function setQty(row,q){
  row.querySelector('.qty-display').textContent=q;
  updateTotals();
}

function updateTotals(){
  let ta=0,tq=0;
  document.querySelectorAll('.item-row').forEach(r=>{
    const a=parseFloat(r.querySelector('.amount-input').value)||0;
    const q=getQty(r);
    r.querySelector('.row-total').textContent=(a*q).toFixed(2);
    ta+=a*q;tq+=q;
  });
  totalAmountEl.textContent=ta.toFixed(2);
  totalQtyEl.textContent=tq;
}

/* ===== RECEIPT (SIMPLE, PRESENT) ===== */
function buildReceipt(){
  return `TOTAL: ₱${totalAmountEl.textContent}\nQTY: ${totalQtyEl.textContent}`;
}

document.getElementById('openSummaryBtn').onclick=()=>{
  document.getElementById('modalTotalAmount').textContent=totalAmountEl.textContent;
  document.getElementById('modalBackdrop').style.display='flex';
};

document.getElementById('modalDoneBtn').onclick=()=>{
  lastReceiptText=buildReceipt();
  document.getElementById('receiptText').value=lastReceiptText;
  document.getElementById('modalBackdrop').style.display='none';
  document.getElementById('receiptBackdrop').style.display='flex';
};

document.getElementById('receiptCloseBtn').onclick=()=>{
  document.getElementById('receiptBackdrop').style.display='none';
};

document.getElementById('copyReceiptBtn').onclick=()=>{
  navigator.clipboard.writeText(lastReceiptText);
};

document.getElementById('printReceiptBtn').onclick=()=>{
  const w=window.open('');
  w.document.write('<pre>'+lastReceiptText+'</pre>');
  w.print();
};

/* ===== INIT ===== */
addRow();
setActiveRow(0);
</script>

</body>
</html>
