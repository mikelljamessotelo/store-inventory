<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Amount × QTY Calculator</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

<style>
/* ===== GLOBAL FIXES ===== */
html{
  font-size:16px;
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  background:#000;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  touch-action:manipulation;
  user-select:none;
}
*,*::before,*::after,
input,button,textarea{
  box-sizing:border-box;
  font-size:16px!important;
  touch-action:manipulation;
}
input,textarea{user-select:text;}
button{cursor:pointer;font-weight:800}

/* ===== LAYOUT ===== */
:root{--keypad-height:260px;--max-width:480px}
.page{min-height:100vh;display:flex;justify-content:center;padding-bottom:var(--keypad-height)}
.app{width:100%;max-width:var(--max-width);padding:12px;display:flex;flex-direction:column;gap:12px}
h1{text-align:center}

/* ===== TOTALS ===== */
.totals{
  display:flex;
  justify-content:space-between;
  background:#111;
  padding:16px;
  border-radius:12px;
  border:1px solid #2a2a2a;
}
.label{color:#aaa}

/* ===== BUTTONS (2× BIGGER) ===== */
button{
  padding:18px;
  font-size:32px!important; /* 2× */
  border-radius:12px;
  border:none;
}
.btn-main{background:#0a84ff;color:#fff}
.btn-reset{background:#222;color:#fff;width:72px}

/* ===== TABLE ===== */
.table{
  background:#111;
  border-radius:10px;
  padding:8px;
  border:1px solid #2a2a2a;
  overflow:auto;
}
.table-header,.item-row{
  display:grid;
  grid-template-columns:1.3fr 1.5fr 1fr;
  gap:6px;
  align-items:center;
}
.table-header{color:#aaa;border-bottom:1px solid #2a2a2a}

/* ===== INPUTS ===== */
.amount-input{
  width:100%;
  padding:10px;
  background:#151515;
  border:1px solid #333;
  border-radius:8px;
  text-align:right;
  color:#fff;
}
.row-total{text-align:right;font-weight:700}

/* ===== QTY INLINE CONTROLS ===== */
.qty-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  visibility:hidden;
}
.item-row.active .qty-wrap{visibility:visible}

.qty-btn{
  width:56px;
  height:56px;
  font-size:36px!important;
  background:#2c2c2e;
  color:#fff;
  border-radius:10px;
}
.qty-display{
  min-width:48px;
  text-align:center;
  font-weight:800;
}

/* ===== KEYPAD ===== */
.keypad-fixed{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:var(--max-width);
  height:var(--keypad-height);
  background:#050505;
  padding:12px;
  border-top:1px solid #181818;
}
.pad-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.num-key{
  background:#1c1c1e;
  color:#fff;
  border-radius:10px;
  border:1px solid #333;
}
.key-main{background:#0a84ff}
.key-danger{background:#b00020}

/* ===== MODAL ===== */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal{
  background:#111;
  padding:16px;
  border-radius:16px;
  width:92%;
  max-width:420px;
  border:1px solid #2a2a2a;
}
</style>
</head>

<body>
<div class="page">
<div class="app">

<h1>Amount × QTY Calculator</h1>

<div class="totals">
  <div><span class="label">Total</span><div id="totalAmount">0.00</div></div>
  <div><span class="label">QTY</span><div id="totalQty">0</div></div>
</div>

<div style="display:flex;gap:8px">
  <button class="btn-main" id="openSummaryBtn">DONE</button>
  <button class="btn-reset" id="resetBtn">↻</button>
</div>

<div class="table" id="rowsWrap">
  <div class="table-header">
    <div>Amount</div>
    <div style="text-align:center">QTY</div>
    <div style="text-align:right">Total</div>
  </div>
  <div id="rows"></div>
</div>

</div>
</div>

<!-- ===== KEYPAD ===== -->
<div class="keypad-fixed">
  <div class="pad-grid">
    <button class="num-key">7</button><button class="num-key">8</button><button class="num-key">9</button><button class="num-key key-danger">⌫</button>
    <button class="num-key">4</button><button class="num-key">5</button><button class="num-key">6</button><button class="num-key key-danger">AC</button>
    <button class="num-key">1</button><button class="num-key">2</button><button class="num-key">3</button><button class="num-key key-main">↓</button>
    <button class="num-key">0</button><button class="num-key">00</button><button class="num-key">.</button>
  </div>
</div>

<script>
let rows=document.getElementById('rows');
let active=0;

function addRow(){
  const i=rows.children.length;
  const r=document.createElement('div');
  r.className='item-row';
  r.dataset.i=i;
  r.innerHTML=`
    <input class="amount-input" readonly>
    <div class="qty-wrap">
      <button class="qty-btn" onclick="chg(${i},-1)">−</button>
      <div class="qty-display" id="q${i}">1</div>
      <button class="qty-btn" onclick="chg(${i},1)">+</button>
    </div>
    <div class="row-total" id="t${i}">0.00</div>`;
  r.onclick=()=>sel(i);
  rows.appendChild(r);
}
function sel(i){
  active=i;
  document.querySelectorAll('.item-row').forEach(r=>r.classList.remove('active'));
  document.querySelector(`[data-i="${i}"]`).classList.add('active');
}
function chg(i,d){
  let q=document.getElementById('q'+i);
  let v=Math.max(0,(+q.textContent||0)+d);
  q.textContent=v;
  calc();
}
function calc(){
  let ta=0,tq=0;
  document.querySelectorAll('.item-row').forEach((r,i)=>{
    let a=parseFloat(r.querySelector('.amount-input').value)||0;
    let q=+document.getElementById('q'+i).textContent||0;
    document.getElementById('t'+i).textContent=(a*q).toFixed(2);
    ta+=a*q;tq+=q;
  });
  totalAmount.textContent=ta.toFixed(2);
  totalQty.textContent=tq;
}

addRow();sel(0);
</script>
</body>
</html>
