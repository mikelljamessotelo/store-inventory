<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mattmat Purchase Text (Copy)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #f5f5f5;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      padding: 12px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
      text-align: center;
    }

    .note {
      font-size: 12px;
      color: #555;
      text-align: center;
      margin-bottom: 10px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #fafafa;
      cursor: pointer;
      font-size: 14px;
    }

    button:active {
      transform: scale(0.98);
    }

    #copyBtn {
      background: #4caf50;
      border-color: #388e3c;
      color: #fff;
      font-weight: 600;
    }

    #refreshBtn {
      background: #eeeeee;
    }

    #status {
      font-size: 12px;
      text-align: center;
      margin-bottom: 8px;
      min-height: 16px;
      color: #333;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      box-sizing: border-box;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid #ccc;
      padding: 8px;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      white-space: pre;
    }

    @media (max-width: 600px) {
      .wrap {
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Mattmat Purchase — Text Copy</h1>
    <div class="note">
      Uses items marked for purchase in your main inventory (checked items).<br>
      Format: <code>***CATEGORY***</code> then <code>- Item</code>
    </div>

    <div class="buttons">
      <button id="refreshBtn">🔄 Refresh from Inventory</button>
      <button id="copyBtn">📋 Copy Text</button>
    </div>

    <div id="status"></div>

    <textarea id="output" readonly placeholder="No data yet..."></textarea>
  </div>

  <script>
  const KEY = 'store_inventory_v3_2_7';
  const MAX_CHARS = 32;

  const outputEl = document.getElementById('output');
  const statusEl = document.getElementById('status');
  const copyBtn = document.getElementById('copyBtn');
  const refreshBtn = document.getElementById('refreshBtn');

  function loadProductsFromLocalStorage() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return [];
      const data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch {
      return [];
    }
  }

  function escapePlain(str) {
    return String(str ?? "")
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n");
  }

  /* ---- 32 CHAR LINE WRAPPER ---- */
  function wrapLine(text, prefix = '') {
    const words = text.split(' ');
    const lines = [];
    let current = prefix;

    words.forEach(word => {
      if ((current + (current.trim() ? ' ' : '') + word).length > MAX_CHARS) {
        lines.push(current.padEnd(0));
        current = prefix + word;
      } else {
        current += (current.trim() ? ' ' : '') + word;
      }
    });

    if (current.trim()) lines.push(current);
    return lines;
  }

  function buildText() {
    const products = loadProductsFromLocalStorage();
    if (!products.length) {
      statusEl.textContent = 'No products found.';
      outputEl.value = '';
      return;
    }

    const checked = products.filter(p => p && p.checked);
    if (!checked.length) {
      statusEl.textContent = 'No items checked for purchase.';
      outputEl.value = '';
      return;
    }

    const groups = new Map();
    checked.forEach(item => {
      const cat = item.category?.trim() || 'UNCATEGORIZED';
      const name = item.name?.trim();
      if (!name) return;
      if (!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push(name);
    });

    let lines = [];

    for (const [cat, items] of groups.entries()) {
      const header = `***${escapePlain(cat).toUpperCase()}***`;
      wrapLine(header).forEach(l => lines.push(l));

      items.forEach(name => {
        wrapLine(escapePlain(name), '- ').forEach(l => lines.push(l));
      });

      lines.push('');
    }

    outputEl.value = lines.join('\n');
    statusEl.textContent =
      `Loaded ${checked.length} item(s) in ${groups.size} categor(y/ies).`;
  }

  async function copyText() {
    const text = outputEl.value || '';
    if (!text.trim()) {
      statusEl.textContent = 'Nothing to copy.';
      return;
    }

    try {
      await navigator.clipboard.writeText(text);
      statusEl.textContent = 'Copied to clipboard ✅';
    } catch {
      outputEl.select();
      document.execCommand('copy');
      statusEl.textContent = 'Copied (fallback)';
    }
  }

  copyBtn.addEventListener('click', copyText);
  refreshBtn.addEventListener('click', buildText);
  window.addEventListener('load', buildText);
</script>
</body>
</html>
