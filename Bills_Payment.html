<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bills Payment — 32-char Receipt</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
*{
  box-sizing:border-box;
  font-size:16px;
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  padding:18px;
  background:#f4f4f4;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  max-width:760px;
  margin:auto;
  background:#fff;
  padding:16px;
  border-radius:8px;
}

fieldset{
  border:1px solid #ddd;
  border-radius:8px;
  padding:12px;
  margin-top:14px;
}

legend{
  font-weight:700;
  padding:0 6px;
}

label{
  display:block;
  font-weight:600;
  margin-top:10px;
}

input,textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:6px;
}

textarea{
  font-family:"Courier New",monospace;
  white-space:pre;
}

.inline{
  display:flex;
  gap:14px;
  margin-top:6px;
  align-items:center;
}

button{
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.blue{background:#007bff;color:#fff}
.red{background:#dc3545;color:#fff}
.gray{background:#6c757d;color:#fff}
</style>
</head>

<body>
<div class="container">

<!-- ===== BILLER ===== -->
<fieldset>
<legend>Biller</legend>
<div class="inline">
  <label><input type="checkbox" name="billerOpt" value="Tarelco 1"> Tarelco 1</label>
  <label><input type="checkbox" name="billerOpt" value="Prime Water"> Prime Water</label>
  <label><input type="checkbox" name="billerOpt" value="manual"> Blank Text Box</label>
</div>
<input id="billerManual" placeholder="Enter biller name" disabled>
</fieldset>

<!-- ===== CUSTOMER DETAILS ===== -->
<fieldset>
<legend>Customer Details</legend>
<label>Name</label>
<input id="name">

<label>Account #</label>
<input id="account">

<label>Due Date</label>
<input id="due">
</fieldset>

<!-- ===== PAYMENT DETAILS ===== -->
<fieldset>
<legend>Payment Details</legend>
<label>Bill Amount</label>
<input id="bill" inputmode="decimal">

<label>Penalty</label>
<input id="penalty" inputmode="decimal">

<label>Service Fee</label>
<input id="fee" inputmode="decimal">

<label>TOTAL AMOUNT</label>
<input id="total" readonly>
</fieldset>

<!-- ===== REFERENCE ===== -->
<fieldset>
<legend>Reference</legend>
<label>Reference Number</label>
<input id="ref">

<label>Date Paid</label>
<input id="paid">
</fieldset>

<button class="blue" onclick="generate()">Generate Receipt</button>
<button class="gray" onclick="copyReceipt()">Copy Receipt</button>
<button class="red" onclick="clearAll()">Clear</button>

<label>Receipt</label>
<textarea id="receipt" readonly></textarea>

</div>

<script>
/* ===== 32-CHAR CONFIG ===== */
const W=32, R=13;

/* ===== HELPERS ===== */
const money=n=>"P "+Number(n||0).toFixed(2)
  .replace(/\B(?=(\d{3})+(?!\d))/g,",");

const L=s=>(s+" ".repeat(W)).slice(0,W);
const C=s=>L(" ".repeat((W-s.length)>>1)+s);
const dash=()=>"-".repeat(W);

const line=(l,r)=>{
  r=(r||"").slice(-R).padStart(R);
  l=(l||"").slice(0,W-R-1);
  return L(l+" ".repeat(W-l.length-r.length)+r);
};

/* ===== BILLER CHECKBOX ===== */
const checks=[...document.querySelectorAll('input[name="billerOpt"]')];
const manual=document.getElementById("billerManual");

checks.forEach(c=>{
  c.onchange=()=>{
    checks.forEach(x=>{ if(x!==c) x.checked=false; });
    manual.disabled = c.value!=="manual";
    if(manual.disabled) manual.value="";
  };
});

function getBiller(){
  const c=checks.find(x=>x.checked);
  if(!c) return "-";
  return c.value==="manual" ? (manual.value||"-") : c.value;
}

/* ===== TOTAL AUTO ===== */
["bill","penalty","fee"].forEach(id=>{
  document.getElementById(id).oninput=()=>{
    const b=+bill.value||0;
    const p=+penalty.value||0;
    const f=+fee.value||0;
    total.value=(b+p+f).toFixed(2);
  };
});

/* ===== GENERATE RECEIPT ===== */
function generate(){
  const b=+bill.value||0;
  const p=+penalty.value||0;
  const f=+fee.value||0;
  const t=b+p+f;

  total.value=t.toFixed(2);

  const now=new Date();
  const date=now.toLocaleDateString("en-US",{month:"short",day:"2-digit",year:"numeric"});
  const time=now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});

  const r=[];
  r.push(C("BILLS PAYMENT"));
  r.push("");
  r.push(line("Date:",date));
  r.push(line("Time:",time));
  r.push(dash());
  r.push(line("Biller:",getBiller()));
  r.push(line("Name:",name.value||"-"));
  r.push(line("Account #:",account.value||"-"));
  r.push(line("Due Date:",due.value||"-"));
  r.push(dash());
  r.push(line("Bill Amount:",money(b)));
  r.push(line("Penalty:",money(p)));
  r.push(line("Service Fee:",money(f)));
  r.push(line("TOTAL AMOUNT:",money(t)));
  r.push(dash());
  r.push(line("Reference No.:",ref.value||"-"));
  r.push(line("Date Paid:",paid.value||"-"));
  r.push(dash());

  receipt.value=r.join("\n");
}

/* ===== COPY ===== */
function copyReceipt(){
  if(!receipt.value.trim()){
    alert("No receipt to copy.");
    return;
  }
  navigator.clipboard.writeText(receipt.value)
    .then(()=>alert("Receipt copied!"))
    .catch(()=>alert("Copy failed. Long-press and copy."));
}

/* ===== CLEAR ===== */
function clearAll(){
  document.querySelectorAll("input").forEach(i=>{
    if(i.type==="checkbox") i.checked=false;
    else i.value="";
  });
  manual.disabled=true;
  receipt.value="";
}
</script>
</body>
</html>
