<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bills Payment Receipt</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
*{
  box-sizing:border-box;
  font-size:16px;
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  padding:16px;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f4f4;
}
.container{
  max-width:720px;
  margin:auto;
  background:#fff;
  padding:16px;
  border-radius:8px;
}
label{
  display:block;
  margin-top:8px;
  font-weight:600;
}
input, textarea{
  width:100%;
  padding:8px;
  margin-top:4px;
  border:1px solid #ccc;
  border-radius:4px;
}
textarea{
  font-family:"Courier New",monospace;
  white-space:pre;
}
button{
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  border-radius:6px;
  background:#007bff;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="container">

<label>Biller</label>
<input id="biller" value="Tarelco 1">

<label>Name</label>
<input id="name">

<label>Acct #</label>
<input id="acct">

<label>Due Date</label>
<input id="due">

<label>Amount Due</label>
<input id="amount">

<label>Penalty</label>
<input id="penalty">

<label>Total Bill</label>
<input id="totalbill">

<label>Service Fee</label>
<input id="fee">

<label>Reference Number</label>
<input id="ref">

<label>Paid on</label>
<input id="paidon">

<label>Cash</label>
<input id="cash">

<button onclick="generate()">Generate Receipt</button>

<label>Receipt</label>
<textarea id="out" rows="22" readonly></textarea>

</div>

<script>
const W = 32;
const line = s => (s + " ".repeat(W)).slice(0, W);
const sep = "-".repeat(W);

function money(v){
  return "P " + Number(v||0).toFixed(2);
}

function r(label, value){
  const s = label + " ".repeat(W - label.length - value.length) + value;
  return s.slice(0, W);
}

function generate(){
  const amount = Number(amountInput.value || 0);
  const penalty = Number(penaltyInput.value || 0);
  const totalBill = Number(totalbillInput.value || 0);
  const fee = Number(feeInput.value || 0);
  const cash = Number(cashInput.value || 0);
  const totalAmount = totalBill + fee;
  const change = cash - totalAmount;

  const receipt = [
    line("         BILLS PAYMENT        "),
    "",
    line("BILLER: " + biller.value),
    line("Name: " + name.value),
    line("Acct #: " + acct.value),
    line("Due Date: " + due.value),
    sep,
    r("AMOUNT DUE:", money(amount)),
    r("PENALTY:", money(penalty)),
    r("TOTAL BILL:", money(totalBill)),
    sep,
    line("Reference Number: " + ref.value),
    line("Paid on: " + paidon.value),
    sep,
    r("Service Fee:", money(fee)),
    r("TOTAL AMOUNT:", money(totalAmount)),
    r("CASH:", money(cash)),
    r("CHANGE:", money(change))
  ].join("\n");

  out.value = receipt;
}

const amountInput = document.getElementById("amount");
const penaltyInput = document.getElementById("penalty");
const totalbillInput = document.getElementById("totalbill");
</script>
</body>
</html>
