<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bills Payment — Locked Layout</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
*{
  box-sizing:border-box;
  font-size:16px;
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  padding:18px;
  background:#f4f4f4;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  max-width:760px;
  margin:auto;
  background:#fff;
  padding:16px;
  border-radius:8px;
}

/* ===== BUTTON CHECKBOX ===== */
.biller-group{
  display:flex;
  gap:10px;
  margin-top:6px;
}

.biller-btn{
  padding:10px 14px;
  border:1px solid #ccc;
  border-radius:6px;
  cursor:pointer;
  user-select:none;
}

.biller-btn.active{
  background:#007bff;
  color:#fff;
  border-color:#007bff;
}

label{
  display:block;
  font-weight:600;
  margin-top:10px;
}

input,textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:6px;
}

textarea{
  font-family:"Courier New",monospace;
  white-space:pre;
}

button{
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.blue{background:#007bff;color:#fff}
.gray{background:#6c757d;color:#fff}
.red{background:#dc3545;color:#fff}
</style>
</head>

<body>
<div class="container">

<!-- ===== HEADER INPUTS ===== -->
<label>Reference #</label>
<input id="ref">

<label>Date Paid</label>
<input id="datePaid">

<!-- ===== BILLER ===== -->
<label>Biller</label>
<div class="biller-group">
  <div class="biller-btn" data-val="Tarelco 1">Tarelco 1</div>
  <div class="biller-btn" data-val="Prime Water">Prime Water</div>
  <div class="biller-btn" data-val="manual">Manual</div>
</div>
<input id="billerManual" placeholder="Enter biller name" disabled>

<!-- ===== ACCOUNT ===== -->
<label>Acct Name</label>
<input id="acctName">

<label>Acct #</label>
<input id="acctNo">

<label>Due Date</label>
<input id="due">

<!-- ===== BILL ===== -->
<label>Bill Amount</label>
<input id="bill" inputmode="decimal">

<label>Penalty</label>
<input id="penalty" inputmode="decimal">

<label>TOTAL BILL</label>
<input id="totalBill" readonly>

<label>Service Fee</label>
<input id="fee" inputmode="decimal">

<label>Total Amount</label>
<input id="totalAmount" readonly>

<label>Cash</label>
<input id="cash" inputmode="decimal">

<label>CHANGE</label>
<input id="change" readonly>

<button class="blue" onclick="generate()">Generate Receipt</button>
<button class="gray" onclick="copyReceipt()">Copy Receipt</button>
<button class="red" onclick="clearAll()">Clear</button>

<label>Receipt</label>
<textarea id="receipt" readonly></textarea>

</div>

<script>
/* ===== 32 CHAR CONFIG ===== */
const W=32,R=13;

/* ===== HELPERS ===== */
const money=n=>"P "+Number(n||0).toFixed(2)
  .replace(/\B(?=(\d{3})+(?!\d))/g,",");

const L=s=>(s+" ".repeat(W)).slice(0,W);
const C=s=>L(" ".repeat((W-s.length)>>1)+s);
const dash=()=>"-".repeat(W);

const line=(l,r)=>{
  r=(r||"").slice(-R).padStart(R);
  l=(l||"").slice(0,W-R-1);
  return L(l+" ".repeat(W-l.length-r.length)+r);
};

/* ===== BILLER BUTTON LOGIC ===== */
let billerValue="-";
const buttons=[...document.querySelectorAll(".biller-btn")];
const manual=document.getElementById("billerManual");

buttons.forEach(btn=>{
  btn.onclick=()=>{
    buttons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    billerValue=btn.dataset.val;
    manual.disabled = billerValue!=="manual";
    if(manual.disabled) manual.value="";
  };
});

function getBiller(){
  if(billerValue==="manual") return manual.value||"-";
  return billerValue;
}

/* ===== COMPUTATION ===== */
["bill","penalty","fee","cash"].forEach(id=>{
  document.getElementById(id).oninput=compute;
});

function compute(){
  const b=+bill.value||0;
  const p=+penalty.value||0;
  const f=+fee.value||0;
  const c=+cash.value||0;

  const tb=b+p;
  const ta=tb+f;
  const ch=c-ta;

  totalBill.value=tb.toFixed(2);
  totalAmount.value=ta.toFixed(2);
  change.value=ch.toFixed(2);
}

/* ===== GENERATE RECEIPT ===== */
function generate(){
  const r=[];
  r.push(C("BILLS PAYMENT"));
  r.push("");
  r.push(line("Reference #:",ref.value||"-"));
  r.push(line("Date Paid:",datePaid.value||"-"));
  r.push(dash());
  r.push(line("Biller:",getBiller()));
  r.push(line("Acct Name:",acctName.value||"-"));
  r.push(line("Acct #:",acctNo.value||"-"));
  r.push(line("Due Date:",due.value||"-"));
  r.push(line("Bill Amount:",money(bill.value)));
  r.push(line("Penalty:",money(penalty.value)));
  r.push(line("TOTAL BILL:",money(totalBill.value)));
  r.push(dash());
  r.push(line("Service Fee:",money(fee.value)));
  r.push(line("Total Amount:",money(totalAmount.value)));
  r.push(line("Cash:",money(cash.value)));
  r.push(line("CHANGE:",money(change.value)));

  receipt.value=r.join("\n");
}

/* ===== COPY ===== */
function copyReceipt(){
  if(!receipt.value.trim()) return alert("No receipt to copy");
  navigator.clipboard.writeText(receipt.value)
    .then(()=>alert("Receipt copied"));
}

/* ===== CLEAR ===== */
function clearAll(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  buttons.forEach(b=>b.classList.remove("active"));
  billerValue="-";
  manual.disabled=true;
  receipt.value="";
}
</script>
</body>
</html>
