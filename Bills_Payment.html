<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bills Payment Receipt</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
*{
  box-sizing:border-box;
  font-size:16px;
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  padding:16px;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f4f4;
}
.container{
  max-width:720px;
  margin:auto;
  background:#fff;
  padding:16px;
  border-radius:8px;
}
label{
  display:block;
  margin-top:8px;
  font-weight:600;
}
input, textarea{
  width:100%;
  padding:8px;
  margin-top:4px;
  border:1px solid #ccc;
  border-radius:4px;
}
textarea{
  font-family:"Courier New",monospace;
  white-space:pre;
}
button{
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  border-radius:6px;
  background:#007bff;
  color:#fff;
  cursor:pointer;
}
.copy{
  background:#28a745;
}
</style>
</head>

<body>
<div class="container">

<label>Biller</label>
<input id="biller" value="Tarelco 1">

<label>Name</label>
<input id="name">

<label>Acct #</label>
<input id="acct">

<label>Due Date</label>
<input id="due">

<label>Amount Due</label>
<input id="amount">

<label>Penalty</label>
<input id="penalty">

<label>Total Bill</label>
<input id="totalbill">

<label>Service Fee</label>
<input id="fee">

<label>Reference Number</label>
<input id="ref">

<label>Paid on</label>
<input id="paidon">

<label>Cash</label>
<input id="cash">

<button onclick="generate()">Generate Receipt</button>
<button class="copy" onclick="copyReceipt()">Copy Receipt</button>

<label>Receipt</label>
<textarea id="out" rows="22" readonly></textarea>

</div>

<script>
const W = 32;
const sep = "-".repeat(W);

function padLine(text){
  return (text + " ".repeat(W)).slice(0, W);
}

function money(v){
  return "P " + Number(v || 0).toFixed(2);
}

function right(label, value){
  const space = W - label.length - value.length;
  return (label + " ".repeat(space > 0 ? space : 1) + value).slice(0, W);
}

function generate(){
  // 🔧 FIX: explicitly get inputs
  const biller = document.getElementById("biller").value;
  const name = document.getElementById("name").value;
  const acct = document.getElementById("acct").value;
  const due = document.getElementById("due").value;
  const amount = Number(document.getElementById("amount").value || 0);
  const penalty = Number(document.getElementById("penalty").value || 0);
  const totalBill = Number(document.getElementById("totalbill").value || 0);
  const fee = Number(document.getElementById("fee").value || 0);
  const ref = document.getElementById("ref").value;
  const paidon = document.getElementById("paidon").value;
  const cash = Number(document.getElementById("cash").value || 0);

  const totalAmount = totalBill + fee;
  const change = cash - totalAmount;

  const receipt = [
    padLine("         BILLS PAYMENT        "),
    "",
    padLine("BILLER: " + biller),
    padLine("Name: " + name),
    padLine("Acct #: " + acct),
    padLine("Due Date: " + due),
    sep,
    right("AMOUNT DUE:", money(amount)),
    right("PENALTY:", money(penalty)),
    right("TOTAL BILL:", money(totalBill)),
    sep,
    padLine("Reference Number: " + ref),
    padLine("Paid on: " + paidon),
    sep,
    right("Service Fee:", money(fee)),
    right("TOTAL AMOUNT:", money(totalAmount)),
    right("CASH:", money(cash)),
    right("CHANGE:", money(change))
  ].join("\n");

  document.getElementById("out").value = receipt;
}

function copyReceipt(){
  const out = document.getElementById("out");
  if(!out.value.trim()){
    alert("Generate the receipt first.");
    return;
  }
  navigator.clipboard.writeText(out.value)
    .then(()=>alert("Receipt copied"))
    .catch(()=>alert("Copy failed"));
}
</script>
</body>
</html>
