<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Checker / Quick Edit</title>

<style>
body{
  font-family: system-ui,-apple-system,Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:0;
}

/* HEADER */
header{
  background:#2e7d32;
  color:#fff;
  padding:22px;
  font-size:34px;
  font-weight:800;
  text-align:center;
}

/* LAYOUT */
.container{
  max-width:860px;
  margin:24px auto;
  padding:0 16px;
}

/* SEARCH */
.search input{
  width:100%;
  font-size:32px;
  padding:18px;
  border-radius:12px;
  border:2px solid #aaa;
  text-align:center;
  font-weight:700;
}

/* CARD */
.card{
  background:#fff;
  margin-top:22px;
  padding:26px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
  display:none;
}

/* ITEM NAME + SELL PRICE */
.item-name{
  font-size:42px;
  font-weight:800;
  color:#000;
  margin-bottom:8px;
}

.sell-big{
  font-size:52px;
  font-weight:900;
  background:#ffeb3b;
  color:#000;
  padding:14px;
  border-radius:12px;
  text-align:center;
  margin-bottom:22px;
}

/* TABLE FORM */
.form-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 14px;
}

.form-table td{
  font-size:24px;
  vertical-align:middle;
}

.form-table .label{
  width:42%;
  font-weight:700;
  color:#444;
}

/* INPUTS */
.form-table input{
  width:100%;
  font-size:24px;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid #999;
  text-align:left;        /* LEFT aligned */
  font-weight:800;        /* BOLD */
}

.readonly{
  font-weight:800;
  font-size:24px;
}

/* BUTTONS */
.btn-row{
  display:flex;
  gap:14px;
  margin-top:26px;
}

button{
  flex:1;
  padding:18px;
  font-size:22px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:800;
}

.btn-save{background:#4caf50;color:#fff}
.btn-dup{background:#1976d2;color:#fff}
.btn-cancel{background:#e0e0e0}

/* NOT FOUND */
.not-found{
  margin-top:24px;
  text-align:center;
  font-size:26px;
  color:#d32f2f;
  display:none;
}

/* FOOTER */
footer{
  text-align:center;
  font-size:15px;
  color:#777;
  margin:22px 0;
}
</style>
</head>

<body>

<header>🧾 PRICE CHECKER / QUICK EDIT</header>

<div class="container">

  <div class="search">
    <input id="searchInput" type="text"
           placeholder="Scan barcode or type item name"
           autofocus>
  </div>

  <div class="card" id="itemCard">
    <div class="item-name" id="itemName"></div>
    <div class="sell-big">₱ <span id="sellBig"></span></div>

    <table class="form-table">
      <tr>
        <td class="label">Barcode</td>
        <td class="readonly" id="barcode"></td>
      </tr>
      <tr>
        <td class="label">Category</td>
        <td class="readonly" id="category"></td>
      </tr>
      <tr>
        <td class="label">Packs</td>
        <td><input id="packs" type="number" min="0"></td>
      </tr>
      <tr>
        <td class="label">Pcs / Pack</td>
        <td><input id="pcs" type="number" min="1"></td>
      </tr>
      <tr>
        <td class="label">Cost / Pack</td>
        <td><input id="costPack" type="number" min="0" step="any"></td>
      </tr>
      <tr>
        <td class="label">Cost / PC</td>
        <td class="readonly"><span id="costPc"></span></td>
      </tr>
      <tr>
        <td class="label">Sell Price</td>
        <td><input id="sellPrice" type="number" min="0" step="any"></td>
      </tr>
      <tr>
        <td class="label">Remarks</td>
        <td><input id="remarks" type="text"></td>
      </tr>
    </table>

    <div class="btn-row">
      <button class="btn-save" onclick="saveChanges()">💾 Save</button>
      <button class="btn-dup" onclick="duplicateItem()">📄 Duplicate</button>
      <button class="btn-cancel" onclick="clearView()">Cancel</button>
    </div>
  </div>

  <div class="not-found" id="notFound">Item not found</div>
</div>

<footer>© 2025 Mattmat Store</footer>

<script>
const STORAGE_KEY = 'store_inventory_v3_2_7';

const input = document.getElementById('searchInput');
const card = document.getElementById('itemCard');
const notFound = document.getElementById('notFound');

let products=[], current=null;

window.onload = ()=>input.focus();

input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    findItem(input.value);
    setTimeout(()=>input.select(),50);
  }
});

function load(){ products = JSON.parse(localStorage.getItem(STORAGE_KEY))||[]; }
function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(products)); }

function computeCost(packs,pcs,cpp){
  packs=+packs||0; pcs=+pcs||0; cpp=+cpp||0;
  if(packs*pcs===0) return 0;
  return cpp/(packs*pcs);
}

function findItem(raw){
  const key=String(raw).trim().toLowerCase();
  if(!key) return;
  load();
  current=products.find(p =>
    String(p.barcode||'').toLowerCase()===key ||
    String(p.name||'').toLowerCase().includes(key)
  );
  if(!current){
    card.style.display='none';
    notFound.style.display='block';
    return;
  }
  notFound.style.display='none';
  card.style.display='block';

  itemName.textContent=current.name||'';
  barcode.textContent=current.barcode||'-';
  category.textContent=current.category||'-';
  packs.value=current.packs||0;
  pcs.value=current.pcsPerPack||1;
  costPack.value=current.costPerPack||0;
  costPc.textContent=format(current.cost);
  sellPrice.value=current.sellPrice||'';
  sellBig.textContent=format(current.sellPrice);
  remarks.value=current.remarks||'';
}

[packs,pcs,costPack].forEach(el=>el.addEventListener('input',()=>{
  const c=computeCost(packs.value,pcs.value,costPack.value);
  costPc.textContent=format(c);
}));

sellPrice.addEventListener('input',()=>{
  sellBig.textContent=format(sellPrice.value);
});

function saveChanges(){
  if(!current) return;
  current.packs=+packs.value||0;
  current.pcsPerPack=+pcs.value||1;
  current.costPerPack=+costPack.value||0;
  current.cost=computeCost(packs.value,pcs.value,costPack.value);
  current.sellPrice=sellPrice.value===''?'':+sellPrice.value;
  current.remarks=remarks.value||'';
  current.suggestedSellPrice=current.cost*1.2;
  current.markup=(+current.sellPrice||0)-current.cost;
  save();
  alert('Saved');
}

function duplicateItem(){
  if(!current) return;
  const copy=JSON.parse(JSON.stringify(current));
  copy.id='id_'+Math.random().toString(36).slice(2,9);
  copy.barcode='';
  copy.name=current.name+' (copy)';
  copy.checked=false;
  products.push(copy);
  save();
  alert('Duplicated');
}

function clearView(){
  card.style.display='none';
  notFound.style.display='none';
  current=null;
}

function format(v){
  if(v===null||v===undefined||v==='') return '';
  return Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
</script>

</body>
</html>
