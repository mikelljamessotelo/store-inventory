<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Checker</title>

<style>
body{
  font-family: system-ui,-apple-system,Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
}
header{
  background:#2e7d32;
  color:#fff;
  padding:22px;
  font-size:34px;
  font-weight:800;
  text-align:center;
}
.container{
  max-width:860px;
  margin:24px auto;
  padding:0 16px;
}
.search input{
  width:100%;
  font-size:34px;
  padding:18px;
  border-radius:12px;
  border:2px solid #aaa;
  text-align:center;
  font-weight:700;
}
.card{
  background:#fff;
  margin-top:22px;
  padding:26px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
  display:none;
}
.item-name{
  font-size:44px;
  font-weight:800;
  margin-bottom:12px;
  color:#000;
}

/* SELL PRICE POP */
.sell-big{
  font-size:64px;
  font-weight:900;
  background:#fff9c4;      /* light yellow */
  color:#000;
  padding:20px;
  border-radius:14px;
  text-align:center;
  margin-bottom:26px;
  border:2px solid #fbc02d;
}

.table{
  width:100%;
  border-spacing:0 14px;
}
.table td{
  font-size:26px;
}
.label{
  width:45%;
  font-weight:700;
  color:#444;
}
.value{
  font-weight:800;
  color:#000;
}
.negative{
  color:#d32f2f;
}

.not-found{
  margin-top:24px;
  text-align:center;
  font-size:26px;
  color:#d32f2f;
  display:none;
}
footer{
  text-align:center;
  font-size:15px;
  color:#777;
  margin:22px 0;
}
</style>
</head>

<body>

<header>🧾 PRICE CHECKER</header>

<div class="container">

  <!-- SEARCH (ONLY EDITABLE FIELD) -->
  <div class="search">
    <input id="searchInput"
           placeholder="Scan barcode or type item name"
           autofocus>
  </div>

  <div class="card" id="card">
    <div class="item-name" id="itemName"></div>

    <!-- SELL PRICE POP -->
    <div class="sell-big">
      ₱ <span id="sellPrice"></span>
    </div>

    <table class="table">
      <tr><td class="label">Barcode</td><td class="value" id="barcode"></td></tr>
      <tr><td class="label">Category</td><td class="value" id="category"></td></tr>
      <tr><td class="label">Cost (per PC)</td><td class="value" id="cost"></td></tr>
      <tr><td class="label">Suggested Price</td><td class="value" id="suggested"></td></tr>
      <tr><td class="label">Mark-Up</td><td class="value" id="markup"></td></tr>
    </table>
  </div>

  <div class="not-found" id="notFound">Item not found</div>
</div>

<footer>© 2025 Mattmat Store</footer>

<script>
/* SAME STORAGE KEY */
const KEY = 'store_inventory_v3_2_7';

let products = [];

/* SAME HELPERS */
function computeMarkup(sell, cost){
  return (Number(sell)||0) - (Number(cost)||0);
}
function fmt(v){
  if(v === '' || v === null || v === undefined) return '';
  return Number(v).toLocaleString(undefined,{minimumFractionDigits:2});
}

/* LOAD */
function load(){
  products = JSON.parse(localStorage.getItem(KEY)) || [];
}

/* SEARCH */
searchInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    findItem(searchInput.value);
    setTimeout(()=>searchInput.select(),50);
  }
});

function findItem(q){
  load();
  q = q.trim().toLowerCase();
  const item = products.find(p =>
    String(p.barcode||'').toLowerCase() === q ||
    String(p.name||'').toLowerCase().includes(q)
  );

  if(!item){
    card.style.display = 'none';
    notFound.style.display = 'block';
    return;
  }

  notFound.style.display = 'none';
  card.style.display = 'block';

  itemName.textContent = item.name || '';
  barcode.textContent = item.barcode || '-';
  category.textContent = item.category || '-';

  sellPrice.textContent = fmt(item.sellPrice);
  cost.textContent = fmt(item.cost);
  suggested.textContent = fmt(item.suggestedSellPrice);

  markup.textContent = fmt(item.markup);
  markup.className = item.markup < 0 ? 'value negative' : 'value';
}
</script>

</body>
</html>
