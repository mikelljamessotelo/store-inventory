<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Checker</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        margin: 0;
        padding: 0;
        text-align: center;
    }

    header {
        background: #4CAF50;
        color: white;
        padding: 20px;
        font-size: 32px;
        font-weight: bold;
    }

    .search-box {
        margin: 20px;
    }

    input {
        width: 90%;
        max-width: 500px;
        font-size: 28px;
        padding: 14px;
        border-radius: 10px;
        border: 2px solid #ccc;
        text-align: center;
    }

    .card {
        background: white;
        margin: 20px auto;
        max-width: 600px;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        display: none;
    }

    .item-name {
        font-size: 34px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .row {
        font-size: 26px;
        margin: 8px 0;
        text-align: left;
    }

    .label {
        font-weight: bold;
        color: #555;
    }

    .price {
        font-size: 40px;
        color: #4CAF50;
        font-weight: bold;
        margin-top: 15px;
        text-align: center;
    }

    .not-found {
        font-size: 24px;
        color: red;
        margin-top: 20px;
        display: none;
    }

    footer {
        margin-top: 30px;
        font-size: 14px;
        color: #777;
    }
</style>
</head>

<body>

<header>🧾 PRICE CHECKER</header>

<div class="search-box">
    <input 
        type="text" 
        id="searchInput" 
        placeholder="Scan barcode or type item name"
        autofocus
    >
</div>

<div class="card" id="itemCard">
    <div class="item-name" id="itemName"></div>

    <div class="row"><span class="label">Barcode:</span> <span id="barcode"></span></div>
    <div class="row"><span class="label">Category:</span> <span id="category"></span></div>
    <div class="row"><span class="label">Remarks:</span> <span id="remarks"></span></div>

    <div class="row"><span class="label">Cost / Pack:</span> ₱ <span id="costPack"></span></div>
    <div class="row"><span class="label">Cost / PC:</span> ₱ <span id="costPc"></span></div>

    <div class="price">₱ <span id="sellPrice"></span></div>
</div>

<div class="not-found" id="notFound">Item not found</div>

<footer>© 2025 Mattmat Store</footer>

<script>
/*
 IMPORTANT:
 Change `inventoryData` below if your system uses a different key.
 Expected item fields:
 name, barcode, category, remarks, costPack, costPc, sellPrice
*/

const STORAGE_KEY = "inventoryData";

const input = document.getElementById("searchInput");
const card = document.getElementById("itemCard");
const notFound = document.getElementById("notFound");

input.addEventListener("input", () => {
    const keyword = input.value.trim().toLowerCase();
    if (!keyword) {
        card.style.display = "none";
        notFound.style.display = "none";
        return;
    }

    const items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    const item = items.find(i =>
        (i.barcode && i.barcode.toLowerCase() === keyword) ||
        (i.name && i.name.toLowerCase().includes(keyword))
    );

    if (!item) {
        card.style.display = "none";
        notFound.style.display = "block";
        return;
    }

    notFound.style.display = "none";
    card.style.display = "block";

    document.getElementById("itemName").textContent = item.name || "";
    document.getElementById("barcode").textContent = item.barcode || "-";
    document.getElementById("category").textContent = item.category || "-";
    document.getElementById("remarks").textContent = item.remarks || "-";
    document.getElementById("costPack").textContent = format(item.costPack);
    document.getElementById("costPc").textContent = format(item.costPc);
    document.getElementById("sellPrice").textContent = format(item.sellPrice);

    // Auto-clear for next scan
    setTimeout(() => input.select(), 50);
});

function format(val) {
    if (!val || Number(val) === 0) return "";
    return Number(val).toLocaleString(undefined, { minimumFractionDigits: 2 });
}
</script>

</body>
</html>
