<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Products</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f6f8;
  font-size: 18px;
}

/* prevent iOS zoom */
input, textarea, select, button {
  font-size: 18px !important;
}

/* header */
header {
  background: #0a8acb;
  color: #fff;
  padding: 14px 16px;
  font-weight: 600;
}

/* search */
.search {
  padding: 12px 16px;
}
.search input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

/* csv */
.csv {
  display: flex;
  gap: 10px;
  padding: 0 16px 12px;
}
.csv button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #e5e7eb;
}

/* list */
.list {
  padding: 12px 16px 160px;
}

/* card */
.card {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}
.card.selected {
  outline: 3px solid #0a8acb;
}
.card h3 {
  margin: 0 0 10px;
  font-size: 18px;
  font-weight: 700;
  word-break: break-word;
}

/* row */
.row {
  display: flex;
  justify-content: space-between;
  gap: 14px;
}

.col {
  flex: 1;
  text-align: right; /* RIGHT ALIGN LIKE APP */
}

.label {
  font-size: 14px;
  color: #777;
}

.value {
  font-size: 18px;
  font-weight: 600;
}

.profit {
  color: #16a34a;
}

/* floating buttons */
.fab {
  position: fixed;
  bottom: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.fab button {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: none;
  font-size: 22px;
  color: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,.25);
}
.add { background: #0a8acb; }
.edit { background: #444; }

/* modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-content {
  background: #fff;
  width: 100%;
  max-width: 420px;
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-content h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
}

.modal-content input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

.modal-content input:disabled {
  background: #eee;
  color: #555;
}

/* actions */
.actions {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}
.actions button {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
}
.save {
  background: #0a8acb;
  color: #fff;
}
.cancel {
  background: #e5e7eb;
}
</style>
</head>

<body>

<header>Products</header>

<div class="search">
  <input id="search" placeholder="Search products or scan barcode..." oninput="render()">
</div>

<div class="csv">
  <button onclick="exportCSV()">Export CSV</button>
  <input type="file" accept=".csv" onchange="importCSV(event)">
</div>

<div class="list" id="list"></div>

<div class="fab">
  <button class="edit" onclick="editItem()">✏️</button>
  <button class="add" onclick="openModal()">➕</button>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Add Item</h3>

    <input id="barcode" placeholder="Barcode">
    <input id="name" placeholder="Item name">
    <input id="price" type="number" placeholder="Price">
    <input id="cost" type="number" placeholder="Cost">
    <input id="pcs" type="number" placeholder="Pcs per pack" oninput="recalc()">
    <input id="pack" type="number" placeholder="Cost per pack" oninput="recalc()">

    <div class="actions">
      <button class="save" onclick="save()">Save</button>
      <button class="cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
let items = JSON.parse(localStorage.getItem('items') || '[]');
let selected = null;
let editing = null;
let scanBuffer = '';

document.addEventListener('keypress', e => {
  if (e.key === 'Enter') {
    const idx = items.findIndex(i => i.barcode === scanBuffer);
    if (idx !== -1) selected = idx;
    scanBuffer = '';
    render();
  } else {
    scanBuffer += e.key;
  }
});

function persist() {
  localStorage.setItem('items', JSON.stringify(items));
}

function render() {
  const q = search.value.toLowerCase();
  list.innerHTML = '';

  items.forEach((i, idx) => {
    if (q && !i.name.toLowerCase().includes(q) && i.barcode !== q) return;

    const profit = (i.price - i.cost).toFixed(2);

    const card = document.createElement('div');
    card.className = 'card' + (selected === idx ? ' selected' : '');
    card.onclick = () => selected = idx;

    card.innerHTML = `
      <h3>${i.name || '(No name)'}</h3>
      <div class="row">
        <div class="col">
          <div class="label">Price</div>
          <div class="value">₱${i.price.toFixed(2)}</div>
        </div>
        <div class="col">
          <div class="label">Cost</div>
          <div class="value">₱${i.cost.toFixed(2)}</div>
        </div>
        <div class="col">
          <div class="label">Profit</div>
          <div class="value profit">₱${profit}</div>
        </div>
      </div>
    `;

    list.appendChild(card);
  });

  persist();
}

function openModal(edit=false) {
  modal.style.display = 'flex';
  modalTitle.textContent = edit ? 'Edit Item' : 'Add Item';
}

function closeModal() {
  modal.style.display = 'none';
  editing = null;
  cost.disabled = false;
}

function recalc() {
  const pcsVal = parseFloat(pcs.value);
  const packVal = parseFloat(pack.value);

  if (pcsVal > 0 && packVal > 0) {
    cost.value = (packVal / pcsVal).toFixed(2);
    cost.disabled = true;
  } else {
    cost.disabled = false;
  }
}

function save() {
  const item = {
    barcode: barcode.value || '',
    name: name.value.trim() || '(No name)',
    price: +price.value || 0,
    cost: +cost.value || 0,
    pcs: +pcs.value || 0,
    pack: +pack.value || 0
  };

  if (editing !== null) items[editing] = item;
  else items.push(item);

  closeModal();
  render();
}

function editItem() {
  if (selected === null) return alert('Select an item first');

  editing = selected;
  const i = items[selected];

  openModal(true);
  barcode.value = i.barcode;
  name.value = i.name;
  price.value = i.price;
  cost.value = i.cost;
  pcs.value = i.pcs;
  pack.value = i.pack;

  recalc();
}

function exportCSV() {
  let csv = 'barcode,name,price,cost,pcsPerPack,costPerPack\n';
  items.forEach(i => {
    csv += `${i.barcode},${i.name},${i.price},${i.cost},${i.pcs},${i.pack}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'products.csv';
  a.click();
}

function importCSV(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split('\n').slice(1);
    lines.forEach(l => {
      if (!l.trim()) return;
      const [barcode,name,price,cost,pcs,pack] = l.split(',');
      items.push({
        barcode: barcode || '',
        name: name || '(No name)',
        price: +price || 0,
        cost: +cost || 0,
        pcs: +pcs || 0,
        pack: +pack || 0
      });
    });
    render();
  };
  reader.readAsText(file);
}

render();
</script>

</body>
</html>
