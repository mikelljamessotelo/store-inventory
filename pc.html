<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Mirror (Cards)</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#e5e7eb;
  --card:#ffffff;
  --border:#d1d5db;
  --yellow:#fff9c4;
  --text:#111827;
  --green:#22c55e;
}

html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,Arial,sans-serif;
  color:var(--text);
  font-size:24px;
  display:flex;
  flex-direction:column;
  text-align:center;
}

/* HEADER */
.header{
  padding:12px;
  background:var(--bg);
}

/* SEARCH */
.search input{
  width:100%;
  padding:14px;
  font-size:18px;
  border-radius:12px;
  border:1.5px solid var(--border);
  text-align:center;
}

/* CONTENT */
.content{
  flex:1;
  overflow-y:auto;
  padding:12px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;
}
@media(max-width:480px){
  .grid{grid-template-columns:1fr;}
}

/* CARD */
.card{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  border:1px solid var(--border);
  box-shadow:0 6px 18px rgba(0,0,0,.12);
  cursor:pointer;
}

/* TEXT */
.name{font-size:18px;font-weight:600;margin-bottom:6px;}
.sell{
  background:var(--yellow);
  border-radius:12px;
  padding:12px;
  font-size:26px;
  font-weight:800;
  margin-bottom:8px;
}
.category{font-size:14px;font-weight:600;margin-bottom:8px;}

/* 2 COL */
.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 12px;
}
.field{
  background:#f9fafb;
  border-radius:10px;
  padding:8px;
}
.value{font-weight:600;}
.label{font-size:12px;color:#6b7280;}
.disabled{opacity:.45}

/* ZOOM */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}
.zoom-card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  max-width:520px;
  width:94%;
}

/* INPUTS */
.zoom-card input{
  width:100%;
  padding:6px;
  text-align:center;
  border-radius:8px;
  border:1px solid var(--border);
  font-size:16px;
}
.zoom-card input[readonly]{
  background:#f3f4f6;
}

/* BUTTONS */
.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.actions button{
  flex:1;
  padding:10px;
  font-size:14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#fff;
}

/* FLOATING ADD BUTTON */
.fab{
  position:fixed;
  right:18px;
  bottom:18px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  font-size:32px;
  font-weight:700;
  border:none;
  box-shadow:0 12px 30px rgba(0,0,0,.3);
  cursor:pointer;
  z-index:60;
}

/* BARCODE */
.barcode-wrap{
  margin-top:12px;
  padding-top:8px;
  border-top:1px dashed var(--border);
}
.barcode{
  font-family:"Libre Barcode 39", monospace;
  font-size:36px;
  letter-spacing:-2px;
}
.barcode-text{font-size:12px;color:#6b7280;}
</style>
</head>

<body>

<div class="header">
  <div class="search">
    <input id="searchInput" list="suggestions" placeholder="Search item name or barcode">
    <datalist id="suggestions"></datalist>
  </div>
</div>

<div class="content">
  <div class="grid" id="grid"></div>
</div>

<!-- FLOATING ADD -->
<button class="fab" onclick="addNew()">＋</button>

<!-- ZOOM -->
<div class="overlay" id="overlay" onclick="closeZoom(event)">
  <div class="zoom-card" id="zoomCard"></div>
</div>

<script>
const KEY='store_inventory_v3_2_7';
let products=[];
let currentItem=null;
let originalSnapshot=null;
let editMode=false;
let isNew=false;

/* FORMATTERS */
const f2=v=>v==null||v===''||isNaN(v)?'':Number(v).toFixed(2);
const f0=v=>v==null||v===''||isNaN(v)?'':Math.trunc(Number(v));

function load(){
  products=JSON.parse(localStorage.getItem(KEY))||[];
  buildSuggestions();
  render(products);
}
function saveAll(){
  localStorage.setItem(KEY,JSON.stringify(products));
}

/* SUGGESTIONS */
function buildSuggestions(){
  suggestions.innerHTML='';
  products.forEach(p=>{
    if(p.name){
      const o=document.createElement('option');
      o.value=p.name;
      suggestions.appendChild(o);
    }
    if(p.barcode){
      const o=document.createElement('option');
      o.value=p.barcode;
      suggestions.appendChild(o);
    }
  });
}

/* RENDER */
function render(list){
  grid.innerHTML='';
  list.forEach(p=>{
    const pcs=f0(p.pcsPerPack)||1;
    const mupPack=(Number(p.markup)||0)*pcs;

    const d=document.createElement('div');
    d.className='card';
    d.innerHTML=`
      <div class="name">${p.name||'(No name)'}</div>
      <div class="sell">₱ ${f2(p.sellPrice)}</div>
      <div class="category">${p.category||'-'}</div>

      <div class="two-col">
        ${fieldView(f0(p.packs),'Pack')}
        ${fieldView(f0(p.pcsPerPack),'Pcs / Pack')}
        ${fieldView(f2(p.costPerPack),'Cost / Pack')}
        ${fieldView(f2(p.cost),'Cost / PC')}
        ${fieldView(f2(p.suggestedSellPrice),'Suggested')}
        ${fieldView(f2(p.markup),'Mark-up')}
        <div class="field ${pcs===1?'disabled':''}">
          <div class="value">${pcs===1?'':f2(mupPack)}</div>
          <div class="label">Mark-up / Pack</div>
        </div>
      </div>
    `;
    d.onclick=()=>openZoom(p,false);
    grid.appendChild(d);
  });
}

function fieldView(v,l){
  return `<div class="field"><div class="value">${v||''}</div><div class="label">${l}</div></div>`;
}

/* ADD NEW */
function addNew(){
  currentItem={
    name:'',
    barcode:'',
    category:'',
    packs:'',
    pcsPerPack:'',
    costPerPack:'',
    cost:'',
    suggestedSellPrice:'',
    sellPrice:'',
    markup:''
  };
  originalSnapshot=null;
  editMode=true;
  isNew=true;
  drawZoom();
  overlay.style.display='flex';
}

/* ZOOM */
function openZoom(p){
  currentItem=p;
  originalSnapshot=JSON.parse(JSON.stringify(p));
  editMode=false;
  isNew=false;
  drawZoom();
  overlay.style.display='flex';
}

function drawZoom(){
  const p=currentItem;
  const pcs=f0(p.pcsPerPack)||1;
  const mupPack=(Number(p.markup)||0)*pcs;

  zoomCard.innerHTML=`
    <div class="two-col">
      ${zField('name','Item Name',p.name,'text')}
      ${zField('barcode','Barcode',p.barcode,'text')}
      ${zField('category','Category',p.category,'text')}

      ${zField('packs','Pack',f0(p.packs),'number',1)}
      ${zField('pcsPerPack','Pcs / Pack',f0(p.pcsPerPack),'number',1)}

      ${zField('costPerPack','Cost / Pack',f2(p.costPerPack),'number')}
      ${zField('cost','Cost / PC',f2(p.cost),'number')}
      ${zField('suggestedSellPrice','Suggested',f2(p.suggestedSellPrice),'number')}
      ${zField('sellPrice','Sell Price',f2(p.sellPrice),'number')}
      ${zField('markup','Mark-up',f2(p.markup),'number')}

      <div class="field ${pcs===1?'disabled':''}">
        <div class="value">${pcs===1?'':f2(mupPack)}</div>
        <div class="label">Mark-up / Pack</div>
      </div>
    </div>

    <div class="actions">
      ${
        editMode
          ? `<button onclick="saveEdit()">Save</button>
             <button onclick="cancelEdit()">Cancel</button>`
          : `<button onclick="enableEdit()">Edit</button>
             <button onclick="closeZoom()">Close</button>`
      }
    </div>
  `;
}

function zField(key,label,val,type,step1){
  const readonly = editMode ? '' : 'readonly';
  const step = step1 ? 'step="1"' : 'step="0.01"';
  const inputmode = type==='number' ? 'inputmode="decimal"' : '';
  return `
    <div class="field">
      <input data-key="${key}" type="${type}"
             ${readonly} ${type==='number'?step:''} ${inputmode}
             value="${val||''}">
      <div class="label">${label}</div>
    </div>
  `;
}

function enableEdit(){ editMode=true; drawZoom(); }
function cancelEdit(){
  if(isNew){
    overlay.style.display='none';
    return;
  }
  Object.assign(currentItem,originalSnapshot);
  editMode=false;
  drawZoom();
}
function saveEdit(){
  zoomCard.querySelectorAll('input').forEach(i=>{
    currentItem[i.dataset.key]=i.value;
  });

  if(isNew){
    products.push(currentItem);
    isNew=false;
  }

  saveAll();
  render(products);
  overlay.style.display='none';
}

function closeZoom(e){
  if(!e || e.target===overlay){
    overlay.style.display='none';
  }
}

/* SEARCH */
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.toLowerCase().trim();
  if(!q){render(products);return;}
  render(products.filter(p=>
    (p.name||'').toLowerCase().includes(q) ||
    (p.barcode||'').toLowerCase().includes(q)
  ));
});

/* ESC */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    overlay.style.display='none';
    searchInput.value='';
    render(products);
    searchInput.focus();
    searchInput.select();
  }
});

load();
</script>

</body>
</html>
